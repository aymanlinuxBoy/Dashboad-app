# Read-only access the dashboard needs from the cluster it runs in (the downstream/Run:ai
# GPU cluster). Derived from every kubectl/get --raw call in app-v2.py's Kube class.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-dashboard-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "namespaces",
                "persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/proxy", "services/proxy"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheuses"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["replicas"]
    verbs: ["get", "list"] # optional CRD; harmless if Longhorn isn't installed
