# Copy to secret-upstream-kubeconfig.yaml (gitignored), replace the placeholder with the real
# kubeconfig built from the token minted via clusterrole-upstream.yaml, then:
#   kubectl apply -f secret-upstream-kubeconfig.yaml
# Never commit the filled-in version.
#
# Easiest way to fill this in correctly:
#   kubectl create secret generic runai-dashboard-upstream-kubeconfig \
#     -n runai-dashboard --from-file=kubeconfig=./upstream.kubeconfig \
#     --dry-run=client -o yaml > secret-upstream-kubeconfig.yaml
apiVersion: v1
kind: Secret
metadata:
  name: runai-dashboard-upstream-kubeconfig
  namespace: runai-dashboard
type: Opaque
stringData:
  kubeconfig: |
    REPLACE_ME_WITH_A_REAL_KUBECONFIG_FOR_THE_UPSTREAM_CLUSTER
